<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Anemoia</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="The Anemoia shop is coming soon.">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://anemoiarecordings.myshopify.com">
  <script>window.location.replace("https://anemoiarecordings.myshopify.com");</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #000;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 58px;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .nav-wordmark {
      font-family: 'Archivo Black', sans-serif;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.88);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    nav a {
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      transition: color 0.3s;
    }

    nav a:hover { color: rgba(255,255,255,0.75); }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 40px 80px;
      text-align: center;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(48px, 8vw, 96px);
      letter-spacing: -0.02em;
      line-height: 1.0;
      margin-bottom: 24px;
    }

    .sub {
      font-size: 15px;
      color: rgba(255,255,255,0.5);
      max-width: 420px;
      line-height: 1.7;
    }

    .back-link {
      margin-top: 64px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      transition: color 0.25s;
    }

    .back-link:hover { color: rgba(255,255,255,0.7); }
    .back-link::before { content: '←'; font-size: 13px; }

    @media (max-width: 768px) {
      nav { padding: 0 24px; }
      .nav-links { gap: 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-wordmark">anemoia</a>
    <div class="nav-links">
      <a href="/#about">about</a>
      <a href="/#artists">artists</a>
      <a href="/#news">news</a>
      <a href="/shop.html">shop</a>
    </div>
  </nav>

  <main>
    <div class="label">Shop</div>
    <h1>Coming Soon</h1>
    <p class="sub">We're rebuilding the shop. Check back soon.</p>
    <a href="/" class="back-link">Back to anemoia</a>
  </main>

</body>
</html>
